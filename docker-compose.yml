services:
  mysql:
    image: mysql:8.0
    container_name: beautyshop_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      MYSQL_DATABASE: beautyshop
    command:
      - --default-authentication-plugin=mysql_native_password
      - --max_connections=200
      - --innodb_buffer_pool_size=384M
      - --innodb_log_file_size=64M
      - --innodb_flush_log_at_trx_commit=1
      - --sync_binlog=1
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - beautyshop_net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD:?DB_PASSWORD is required}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.2-alpine
    container_name: beautyshop_redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - beautyshop_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: apache/kafka:3.7.0
    container_name: beautyshop_kafka
    restart: unless-stopped
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_INTERNAL://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka:29092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_HEAP_OPTS: "-Xms128m -Xmx256m"
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - beautyshop_net
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-topics.sh", "--bootstrap-server", "localhost:29092", "--list"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  chatbot:
    build:
      context: ./chatbot/product-agent
      dockerfile: Dockerfile
      args:
        INSTALL_IMAGE_SEARCH: ${IMAGE_SEARCH_ENABLED:-false}
    container_name: beautyshop_chatbot
    restart: unless-stopped
    env_file:
      - ./chatbot/product-agent/.env
    environment:
      HOST: 0.0.0.0
      PORT: 8000
      DEBUG: "false"
      ENVIRONMENT: production
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: root
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      MYSQL_DATABASE: beautyshop
      DATABASE_URL: sqlite:////app/data/cosmetics_ecommerce.db
      QDRANT_URL: /app/data/qdrant_storage
      EMBEDDING_PROVIDER: gemini
      EMBEDDING_CACHE_DIR: /app/data/embedding_cache
      IMAGE_SEARCH_ENABLED: ${IMAGE_SEARCH_ENABLED:-false}
      IMAGE_SEARCH_INTERNAL_TOKEN: ${IMAGE_SEARCH_INTERNAL_TOKEN:-}
      IMAGE_SEARCH_MODEL_ID: ${IMAGE_SEARCH_MODEL_ID:-sentence-transformers/clip-ViT-B-32}
      IMAGE_SEARCH_MODEL_REVISION: ${IMAGE_SEARCH_MODEL_REVISION:-327ab6726d33c0e22f920c83f2ff9e4bd38ca37f}
      IMAGE_SEARCH_INDEX_PATH: /app/data/image-search/index.npz
      IMAGE_SEARCH_CACHE_DIR: /app/data/model-cache
      IMAGE_SEARCH_UPLOAD_DIR: /app/uploads
      IMAGE_SEARCH_MEDIA_ORIGIN: http://backend:8080
      IMAGE_SEARCH_ALLOWED_ORIGINS: ${IMAGE_SEARCH_ALLOWED_ORIGINS:-}
      IMAGE_SEARCH_MAX_BYTES: ${IMAGE_SEARCH_MAX_BYTES:-5242880}
      IMAGE_SEARCH_MAX_PIXELS: ${IMAGE_SEARCH_MAX_PIXELS:-20000000}
      IMAGE_SEARCH_BATCH_SIZE: ${IMAGE_SEARCH_BATCH_SIZE:-16}
      RECOMMENDATION_INTERNAL_TOKEN: ${JWT_SECRET:?JWT_SECRET is required}
    ports:
      - "127.0.0.1:${CHATBOT_PORT:-18000}:8000"
    volumes:
      - chatbot_data:/app/data
      - uploads_data:/app/uploads:ro
    depends_on:
      mysql:
        condition: service_healthy
      backend:
        condition: service_healthy
    networks:
      - beautyshop_net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 180s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: beautyshop_frontend
    restart: unless-stopped
    expose:
      - "80"
    networks:
      - beautyshop_net
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: beautyshop_backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    expose:
      - "8080"
    environment:
      SERVER_PORT: 8080
      DB_URL: jdbc:mysql://mysql:3306/beautyshop?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8&useUnicode=true
      DB_USERNAME: root
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CACHE_PROVIDER: ${CACHE_PROVIDER:-redis}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      JPA_DDL_AUTO: validate
      FLYWAY_ENABLED: "true"
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-900000}
      JWT_REFRESH_EXPIRATION_MS: ${JWT_REFRESH_EXPIRATION_MS:-604800000}
      SEPAY_WEBHOOK_API_KEY: ${SEPAY_WEBHOOK_API_KEY:?SEPAY_WEBHOOK_API_KEY is required}
      SEPAY_BANK_NAME: ${SEPAY_BANK_NAME:-MBBank}
      SEPAY_BANK_ACCOUNT_NAME: ${SEPAY_BANK_ACCOUNT_NAME:-BEAUTYSHOP}
      SEPAY_BANK_ACCOUNT_NUMBER: ${SEPAY_BANK_ACCOUNT_NUMBER:?SEPAY_BANK_ACCOUNT_NUMBER is required}
      SEPAY_BANK_BIN: ${SEPAY_BANK_BIN:-970422}
      MEDIA_UPLOAD_DIR: /app/uploads
      CHATBOT_SERVICE_URL: http://chatbot:8000
      IMAGE_SEARCH_ENABLED: ${IMAGE_SEARCH_ENABLED:-false}
      IMAGE_SEARCH_INTERNAL_TOKEN: ${IMAGE_SEARCH_INTERNAL_TOKEN:-}
      IMAGE_SEARCH_TIMEOUT_SECONDS: ${IMAGE_SEARCH_TIMEOUT_SECONDS:-30}
      RECOMMENDATION_INTERNAL_TOKEN: ${JWT_SECRET:?JWT_SECRET is required}
      MAIL_ENABLED: ${MAIL_ENABLED:-false}
      SPRING_MAIL_HOST: ${SPRING_MAIL_HOST:-smtp.gmail.com}
      SPRING_MAIL_PORT: ${SPRING_MAIL_PORT:-587}
      SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME:-}
      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-no-reply@beautyshop.vn}
      CUSTOMER_APP_URL: ${CUSTOMER_APP_URL:-http://localhost}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      SPA_NOTIFICATIONS_ENABLED: ${SPA_NOTIFICATIONS_ENABLED:-true}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - beautyshop_net
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 90s

  nginx:
    image: nginx:alpine
    container_name: beautyshop_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - uploads_data:/app/uploads:ro
    depends_on:
      backend:
        condition: service_healthy
        restart: true
      frontend:
        condition: service_healthy
        restart: true
      chatbot:
        condition: service_healthy
    networks:
      - beautyshop_net
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: beautyshop_prometheus
    restart: unless-stopped
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - beautyshop_net

  grafana:
    image: grafana/grafana:10.4.0
    container_name: beautyshop_grafana
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD is required}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - beautyshop_net

volumes:
  mysql_data:
  redis_data:
  kafka_data:
  prometheus_data:
  grafana_data:
  uploads_data:
  chatbot_data:

networks:
  beautyshop_net:
    driver: bridge
