name: beautyshop_mobile
description: "BeautyShop E-Commerce & Clinic Spa Mobile Application."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  provider: ^6.1.2
  dio: ^5.4.3+1
  http: ^1.2.1
  shared_preferences: ^2.2.3
  flutter_secure_storage: ^9.2.4
  intl: ^0.19.0
  cached_network_image: ^3.3.1
  url_launcher: ^6.3.0
  image_picker: ^1.2.4
  pdf: ^3.13.1
  printing: ^5.15.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/pageloadingbeautystore.png
    - assets/vietnam-addresses.json
    - assets/fonts/NotoSans-Regular.ttf
    - assets/fonts/OFL-NotoSans.txt
